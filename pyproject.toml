[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complaint-api-testing"
version = "0.1.0"
description = "Maintainable API test automation derived from a legacy Postman collection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["src"]
